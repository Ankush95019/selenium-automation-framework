name: Selenium Automation Pipeline


on:
  repository_dispatch:
    types:
      - run-selenium


permissions:
  contents: read
  pages: write
  id-token: write



jobs:

  automation-test:

    runs-on: ubuntu-latest


    steps:


      # 1. Checkout Selenium Automation Code
      - name: Checkout Automation Code
        uses: actions/checkout@v5



      # 2. Checkout React Application Repository
      - name: Checkout React Application
        uses: actions/checkout@v5

        with:
          repository: Ankush95019/github-actions-demo
          path: frontend-app



      # 3. Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v5

        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven



      # 4. Verify Java Installation
      - name: Verify Java Installation
        run: java -version




      # 5. Install Allure CLI
      - name: Install Allure
        run: |

          sudo apt-get update

          sudo apt-get install -y default-jre wget

          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -zxvf allure-2.34.1.tgz

          sudo mv allure-2.34.1 /opt/allure

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure

          allure --version




      # 6. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v5

        with:
          node-version: '22'




      # 7. Verify Node Installation
      - name: Verify Node Installation
        run: |

          node --version

          npm --version




      # 8. Install React Dependencies
      - name: Install React Dependencies
        working-directory: frontend-app/frontend
        run: npm ci




      # 9. Start React Application
      - name: Start React Application
        working-directory: frontend-app/frontend
        run: |

          npm run start-ci &

          echo "React application started."




      # 10. Install wait-on
      - name: Install wait-on
        run: npm install -g wait-on




      # 11. Wait Until React Application Starts
      - name: Wait for Application
        run: wait-on http://localhost:5173




      # 12. Run Selenium Tests
      - name: Run Selenium Tests
        run: mvn clean test




      # 13. Publish JUnit Test Summary
      - name: Publish JUnit Report
        if: always()

        uses: mikepenz/action-junit-report@v5

        with:
          report_paths: target/surefire-reports/*.xml




      # 14. Generate Allure Report
      - name: Generate Allure Report
        if: always()

        run: |

          allure generate target/allure-results --clean -o allure-report




      # 15. Upload Allure Report Artifact
      - name: Upload Allure Report
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: allure-report

          path: allure-report




      # 16. Configure GitHub Pages
      - name: Setup Pages
        if: always()

        uses: actions/configure-pages@v5




      # 17. Upload Allure Report for GitHub Pages
      - name: Upload Pages Artifact
        if: always()

        uses: actions/upload-pages-artifact@v3

        with:

          path: allure-report






      # 18. Send Email Notification
      - name: Send Email
        if: always()

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true


          username: ${{ secrets.EMAIL_USERNAME }}

          password: ${{ secrets.EMAIL_PASSWORD }}


          subject: Selenium Automation Report - ${{ job.status }}


          to: gk45u10@gmail.com


          from: GitHub Actions


          body: |

            Automation Execution Completed.


            Repository:

            ${{ github.repository }}


            Branch:

            ${{ github.ref_name }}


            Status:

            ${{ job.status }}


            Workflow:

            ${{ github.workflow }}


            Run Number:

            ${{ github.run_number }}


            GitHub Actions Run:

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}




  # =====================================================
  # Deploy Allure Report to GitHub Pages
  # =====================================================


  deploy-pages:


    needs: automation-test


    runs-on: ubuntu-latest



    permissions:

      pages: write

      id-token: write



    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      # 19. Deploy Pages
      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4