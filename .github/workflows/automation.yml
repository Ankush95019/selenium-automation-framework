name: Selenium Automation Pipeline

on:
  workflow_dispatch:


jobs:

  automation-test:

    runs-on: ubuntu-latest


    steps:


      # 1. Checkout Selenium Automation Code
      - name: Checkout Automation Code
        uses: actions/checkout@v5



      # 2. Checkout React Application Repository
      - name: Checkout React Application
        uses: actions/checkout@v5
        with:
          repository: Ankush95019/github-actions-demo
          path: frontend



      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven



      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json



      # 5. Install React Dependencies
      - name: Install React Dependencies
        working-directory: frontend
        run: npm install



      # 6. Start React Application
      - name: Start React Application
        working-directory: frontend
        run: |
          npm run start-ci &



      # 7. Install wait-on
      - name: Install wait-on
        run: npm install -g wait-on



      # 8. Wait for React Application
      - name: Wait for Application
        run: wait-on http://localhost:5173



      # 9. Run Selenium Tests
      - name: Run Selenium Tests
        run: mvn clean test